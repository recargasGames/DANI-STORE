<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Crea tu cuenta en ElectroHogar y solicita tus productos a crédito."
    >

    <title>Crear cuenta | ElectroHogar</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- ==========================================
         HEADER
    =========================================== -->

    <header class="header">

        <div class="container header-content">

            <a href="index.html" class="logo">

                <span class="logo-icon">
                    EH
                </span>

                <span class="logo-text">
                    ElectroHogar
                </span>

            </a>


            <nav class="menu" id="mainMenu">

                <a href="index.html">
                    Inicio
                </a>

                <a href="index.html#productos">
                    Productos
                </a>

                <a href="index.html#categorias">
                    Categorías
                </a>

                <a href="index.html#como-funciona">
                    Cómo funciona
                </a>

            </nav>


            <div class="nav-actions">

                <a
                    href="login.html"
                    class="btn btn-outline"
                >
                    Iniciar sesión
                </a>

                <a
                    href="registro.html"
                    class="btn btn-primary"
                >
                    Crear cuenta
                </a>

            </div>


            <button
                class="menu-toggle"
                id="menuToggle"
                type="button"
                aria-label="Abrir menú"
                aria-expanded="false"
            >
                ☰
            </button>

        </div>

    </header>


    <!-- ==========================================
         REGISTRO
    =========================================== -->

    <main>

        <section class="auth-section">

            <div class="container">

                <div class="auth-container">

                    <div class="auth-card">

                        <!-- Encabezado -->

                        <div class="auth-header">

                            <div class="auth-icon">
                                EH
                            </div>

                            <h1>
                                Crea tu cuenta
                            </h1>

                            <p>
                                Regístrate para comprar,
                                solicitar financiamiento y
                                consultar tus pagos.
                            </p>

                        </div>


                        <!-- ==================================
                             FORMULARIO
                        =================================== -->

                        <form id="registroForm">


                            <!-- NOMBRE -->

                            <div class="form-group">

                                <label
                                    for="nombre"
                                    class="form-label"
                                >
                                    Nombre completo
                                </label>

                                <input
                                    type="text"
                                    id="nombre"
                                    name="nombre"
                                    class="form-control"
                                    placeholder="Ej. María González"
                                    autocomplete="name"
                                    required
                                >

                            </div>


                            <!-- CÉDULA -->

                            <div class="form-group">

                                <label
                                    for="cedula"
                                    class="form-label"
                                >
                                    Cédula / Documento de identidad
                                </label>

                                <input
                                    type="text"
                                    id="cedula"
                                    name="cedula"
                                    class="form-control"
                                    placeholder="Ej. V-12345678"
                                    autocomplete="off"
                                    required
                                >

                            </div>


                            <!-- TELÉFONO -->

                            <div class="form-group">

                                <label
                                    for="telefono"
                                    class="form-label"
                                >
                                    Número de teléfono
                                </label>

                                <input
                                    type="tel"
                                    id="telefono"
                                    name="telefono"
                                    class="form-control"
                                    placeholder="Ej. 0412-1234567"
                                    autocomplete="tel"
                                    required
                                >

                            </div>


                            <!-- CORREO -->

                            <div class="form-group">

                                <label
                                    for="email"
                                    class="form-label"
                                >
                                    Correo electrónico
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    class="form-control"
                                    placeholder="tucorreo@ejemplo.com"
                                    autocomplete="email"
                                    required
                                >

                            </div>


                            <!-- DIRECCIÓN -->

                            <div class="form-group">

                                <label
                                    for="direccion"
                                    class="form-label"
                                >
                                    Dirección
                                </label>

                                <textarea
                                    id="direccion"
                                    name="direccion"
                                    class="form-control"
                                    rows="3"
                                    placeholder="Indica tu dirección de residencia"
                                    autocomplete="street-address"
                                    required
                                ></textarea>

                            </div>


                            <!-- CONTRASEÑA -->

                            <div class="form-group">

                                <label
                                    for="password"
                                    class="form-label"
                                >
                                    Contraseña
                                </label>

                                <div class="password-wrapper">

                                    <input
                                        type="password"
                                        id="password"
                                        name="password"
                                        class="form-control"
                                        placeholder="Mínimo 6 caracteres"
                                        autocomplete="new-password"
                                        minlength="6"
                                        required
                                    >

                                    <button
                                        type="button"
                                        id="togglePassword"
                                        class="password-toggle"
                                        aria-label="Mostrar contraseña"
                                    >
                                        👁
                                    </button>

                                </div>

                            </div>


                            <!-- CONFIRMAR CONTRASEÑA -->

                            <div class="form-group">

                                <label
                                    for="confirmPassword"
                                    class="form-label"
                                >
                                    Confirmar contraseña
                                </label>

                                <div class="password-wrapper">

                                    <input
                                        type="password"
                                        id="confirmPassword"
                                        name="confirmPassword"
                                        class="form-control"
                                        placeholder="Repite tu contraseña"
                                        autocomplete="new-password"
                                        minlength="6"
                                        required
                                    >

                                    <button
                                        type="button"
                                        id="toggleConfirmPassword"
                                        class="password-toggle"
                                        aria-label="Mostrar contraseña"
                                    >
                                        👁
                                    </button>

                                </div>

                            </div>


                            <!-- INFORMACIÓN EXTRA -->

                            <div class="form-group">

                                <label
                                    for="informacion"
                                    class="form-label"
                                >
                                    Información adicional
                                    <span style="font-weight: 400;">
                                        (opcional)
                                    </span>
                                </label>

                                <textarea
                                    id="informacion"
                                    name="informacion"
                                    class="form-control"
                                    rows="3"
                                    placeholder="Información que quieras agregar"
                                ></textarea>

                            </div>


                            <!-- TÉRMINOS -->

                            <div class="form-group">

                                <label class="checkbox-label">

                                    <input
                                        type="checkbox"
                                        id="terminos"
                                        required
                                    >

                                    <span>
                                        Acepto los términos y condiciones
                                        de ElectroHogar.
                                    </span>

                                </label>

                            </div>


                            <!-- MENSAJE -->

                            <div
                                id="registroMessage"
                                class="form-message"
                                style="display: none;"
                            ></div>


                            <!-- BOTÓN -->

                            <button
                                type="submit"
                                class="btn btn-primary btn-full"
                            >
                                Crear mi cuenta
                            </button>

                        </form>


                        <!-- LOGIN -->

                        <div class="auth-divider">
                            <span>o</span>
                        </div>


                        <div class="auth-register">

                            <p>
                                ¿Ya tienes una cuenta?
                            </p>

                            <a
                                href="login.html"
                                class="btn btn-outline btn-full"
                            >
                                Iniciar sesión
                            </a>

                        </div>


                        <!-- VOLVER -->

                        <div class="auth-back">

                            <a href="index.html">
                                ← Volver a la tienda
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- ==========================================
         FOOTER
    =========================================== -->

    <footer class="footer">

        <div class="container">

            <div class="footer-bottom">
                © 2026 ElectroHogar. Todos los derechos reservados.
            </div>

        </div>

    </footer>


    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script src="js/app.js"></script>


    <script>

        // ==========================================
        // ELEMENTOS
        // ==========================================

        const registroForm =
            document.getElementById("registroForm");

        const registroMessage =
            document.getElementById("registroMessage");

        const password =
            document.getElementById("password");

        const confirmPassword =
            document.getElementById("confirmPassword");

        const togglePassword =
            document.getElementById("togglePassword");

        const toggleConfirmPassword =
            document.getElementById("toggleConfirmPassword");


        // ==========================================
        // MOSTRAR CONTRASEÑA
        // ==========================================

        togglePassword.addEventListener("click", () => {

            if (password.type === "password") {

                password.type = "text";
                togglePassword.textContent = "🙈";

            } else {

                password.type = "password";
                togglePassword.textContent = "👁";

            }

        });


        toggleConfirmPassword.addEventListener("click", () => {

            if (confirmPassword.type === "password") {

                confirmPassword.type = "text";
                toggleConfirmPassword.textContent = "🙈";

            } else {

                confirmPassword.type = "password";
                toggleConfirmPassword.textContent = "👁";

            }

        });


        // ==========================================
        // REGISTRO
        // ==========================================

        registroForm.addEventListener("submit", (evento) => {

            evento.preventDefault();


            const nombre =
                document.getElementById("nombre")
                    .value
                    .trim();

            const cedula =
                document.getElementById("cedula")
                    .value
                    .trim();

            const telefono =
                document.getElementById("telefono")
                    .value
                    .trim();

            const email =
                document.getElementById("email")
                    .value
                    .trim();

            const direccion =
                document.getElementById("direccion")
                    .value
                    .trim();

            const informacion =
                document.getElementById("informacion")
                    .value
                    .trim();

            const terminos =
                document.getElementById("terminos")
                    .checked;


            // ==================================
            // VALIDACIONES
            // ==================================

            if (!nombre ||
                !cedula ||
                !telefono ||
                !email ||
                !direccion ||
                !password.value ||
                !confirmPassword.value) {

                mostrarMensajeRegistro(
                    "Completa todos los campos obligatorios."
                );

                return;
            }


            if (password.value.length < 6) {

                mostrarMensajeRegistro(
                    "La contraseña debe tener al menos 6 caracteres."
                );

                return;
            }


            if (password.value !== confirmPassword.value) {

                mostrarMensajeRegistro(
                    "Las contraseñas no coinciden."
                );

                return;
            }


            if (!terminos) {

                mostrarMensajeRegistro(
                    "Debes aceptar los términos y condiciones."
                );

                return;
            }


            // ==================================
            // DATOS PREPARADOS
            // ==================================

            const datosCliente = {

                nombre,
                cedula,
                telefono,
                email,
                direccion,
                informacion,

                fechaRegistro:
                    new Date().toISOString()

            };


            /*
             * ==========================================
             * FIREBASE
             * ==========================================
             *
             * En el siguiente paso conectaremos este
             * formulario con Firebase Authentication
             * y Firestore.
             *
             * La contraseña NO se guardará manualmente
             * en localStorage ni en Firestore.
             * Firebase Authentication será responsable
             * de manejarla de forma segura.
             * ==========================================
             */


            console.log(
                "Datos preparados:",
                datosCliente
            );


            mostrarMensajeRegistro(
                "El registro se conectará con Firebase en el siguiente paso.",
                "info"
            );

        });


        // ==========================================
        // MENSAJES
        // ==========================================

        function mostrarMensajeRegistro(
            mensaje,
            tipo = "error"
        ) {

            registroMessage.textContent =
                mensaje;

            registroMessage.style.display =
                "block";

            registroMessage.className =
                `form-message ${tipo}`;

        }

    </script>

</body>
</html>
